worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;

    log_format upstreamlog '$remote_addr "$request" status=$status upstream=$upstream_addr '
                           'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout upstreamlog;
    error_log  /dev/stderr error;
    # Список серверов, куда будут проксироваться запросы.
    # Подробности по ссылке:
    # https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/
    upstream backend {
        # метод балансировки: по умолчанию round-robin
        # least_conn; - рапсределение по минимальному числу активных соединений
        # ip_hash; - закрепление пользователя за одним сервером

        server host.docker.internal:5001;
        server host.docker.internal:5002;
    }

    # 8080 порт - точка входа для пользователей
    server {
        listen 8080;
        server_name localhost;

        location /summaryHub {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://backend;
            add_header X-Upstream $upstream_addr always;
        }
    }

    # http-сервер на 8081 порту всегда возвращает строку "8081"
    server {
        listen 8081;

        location / {
            return 200 '8081';
            add_header Content-Type text/plain;
        }
    }

    # http-сервер на 8082 порту всегда возвращает строку "8082"
    server {
        listen 8082;

        location / {
            return 200 '8082';
            add_header Content-Type text/plain;
        }
    }
}
